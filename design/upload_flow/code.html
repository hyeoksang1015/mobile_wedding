<script>
  (function() {
    const input = document.getElementById('nicknameInput');
    const counter = document.getElementById('charCounter');
    const clearBtn = document.getElementById('clearNicknameBtn');
    const submitBtn = document.getElementById('submitPhotosBtn');

    if (input && counter) {
      const updateCounter = () => {
        const len = input.value.length;
        counter.textContent = len + ' / 10자 (최대 10자)';
      };

      input.addEventListener('input', updateCounter);
      
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          input.value = '';
          updateCounter();
          input.focus();
        });
      }
    }

    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>등록 중입니다...</span>';
        setTimeout(() => {
          submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span><span>등록 완료되었습니다</span>';
        }, 1200);
      });
    }
  })();
