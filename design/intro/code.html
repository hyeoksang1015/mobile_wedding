  </head><body class="bg-surface text-on-surface pt-safe pb-safe flex flex-col min-h-screen antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed"><main class="flex-1 flex flex-col relative w-full max-w-[430px] mx-auto bg-surface"><div class="flex flex-col w-full relative overflow-hidden select-none">
<!-- Subtle Decorative Floating Petals Canvas -->
<canvas class="absolute inset-0 pointer-events-none z-0 w-full h-full opacity-60" id="ambient-canvas"></canvas>
<!-- Main Introductory Atmosphere Wrapper -->
<div class="relative z-10 flex flex-col justify-between items-center w-full min-h-[777px] px-margin py-space-xl">
<!-- Top Editorial Header & Monogram Seal -->
<div class="flex flex-col items-center text-center space-y-space-md pt-space-xl opacity-90 transition-opacity duration-1000">
<div class="w-10 h-10 rounded-full bg-secondary-container/70 flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined text-primary" style="font-size: 20px; font-variation-settings: 'FILL' 0, 'wght' 300;">favorite</span>
</div>
<div class="flex flex-col items-center space-y-space-xs">
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">Wedding Invitation</span>
<span class="font-poetry-lead text-body-sm text-on-surface-variant font-light tracking-widest">
          두 사람이 함께 시작하는 새로운 계절
        </span>
</div>
</div>
<!-- Centered Visual Showcase & Main Typing Headline -->
<div class="relative flex flex-col items-center justify-center my-auto w-full max-w-[360px] py-space-lg text-center">
<!-- Wildflower Botanical Vector Sketch Motif -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none -z-10 opacity-35">
<svg class="text-primary-container animate-pulse" fill="none" height="260" style="animation-duration: 4s;" viewbox="0 0 220 260" width="220" xmlns="http://www.w3.org/2000/svg">
<path d="M110 240V70M110 70C110 70 85 45 60 70C35 95 70 120 110 70ZM110 70C110 70 135 45 160 70C185 95 150 120 110 70Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"></path>
<path d="M110 160C85 145 65 155 60 168C55 181 72 195 110 178" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1"></path>
<path d="M110 130C135 115 155 125 160 138C165 151 148 165 110 148" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1"></path>
<circle cx="110" cy="55" fill="currentColor" fill-opacity="0.4" r="3.5"></circle>
<circle cx="65" cy="80" fill="currentColor" fill-opacity="0.3" r="2.5"></circle>
<circle cx="155" cy="80" fill="currentColor" fill-opacity="0.3" r="2.5"></circle>
</svg>
</div>
<!-- Atmospheric Couple Portrait Frame -->
<div class="relative w-44 h-56 rounded-full overflow-hidden mb-space-lg shadow-sm bg-surface-container">
<img class="w-full h-full object-cover grayscale-[15%] contrast-[95%] transition-transform duration-700 hover:scale-105" data-alt="Delicate cinematic editorial Korean wedding portrait of Ji-hoon and Seo-yeon standing in soft natural morning sunlight in an ivory garden, warm muted earth tones, soft focus background, quiet and romantic fine art photography aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtLB1QopL8O2W_sNI-RYifr8mh_TOVrxJ2R3wYzPLuAmKZt0dQAjTajfNwbXeUkkPRMdR8IIKLuZiZihvD0SCKncey9Sy8lQ3Zr0_wDFjc8lK6yMMdCk8dcGj2ShmtyqKJZ0X4vyshajudLuYB4DOzvGLNMzUKiQ6CLIrOstcgZpLKeQtKsnLhpyljDau4vNdaoiGUxIN_1t6J_EHoA22a1SNxxItlED-dqktjeC4"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface/40 via-transparent to-transparent"></div>
</div>
<!-- Typing Headline Anchor -->
<div class="min-h-[72px] flex items-center justify-center px-space-sm">
<h1 class="font-headline-lg text-headline-md text-on-surface tracking-tight leading-relaxed">
<span class="inline" id="typed-text"></span><span class="inline-block w-[2px] h-[22px] ml-1 bg-primary-container align-middle transition-opacity duration-300" id="typing-cursor"></span>
</h1>
</div>
<!-- Date & Location Metadata Micro-Card -->
<div class="mt-space-md flex items-center space-x-space-sm px-space-md py-1.5 rounded-full bg-surface-container/60 shadow-sm text-secondary">
<span class="material-symbols-outlined text-primary text-[15px]">calendar_today</span>
<span class="font-label-md text-label-md tracking-wider">2025. 10. 18 SAT 12:30 PM</span>
</div>
</div>
<!-- Bottom Action Pill & Interactive Affordance -->
<div class="w-full flex flex-col items-center space-y-space-md pb-space-lg">
<button class="group relative flex items-center justify-center space-x-space-sm px-space-xl py-3.5 rounded-full bg-surface-container-low text-on-primary-container shadow-sm active:scale-95 transition-all duration-300 hover:bg-secondary-container/50" id="open-invitation-btn" type="button">
<span class="font-body-md text-body-md font-medium tracking-wide">청첩장 열기</span>
<span class="material-symbols-outlined text-primary text-[18px] group-hover:translate-y-0.5 transition-transform duration-300">expand_more</span>
</button>
<span class="font-label-sm text-label-sm text-secondary/60 tracking-widest uppercase">
        Jihoon & Seoyeon
      </span>
</div>
</div>
<!-- Wax Seal Envelope Opening Modal Overlay (Micro-Delight) -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-500 p-margin" id="envelope-modal">
<div class="w-full max-w-[340px] bg-surface-container-lowest rounded-xl p-space-xl flex flex-col items-center text-center shadow-xl transform scale-95 transition-transform duration-500" id="envelope-card">
<div class="w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center text-primary mb-space-md">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">drafts</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-space-xs">소중한 분을 모십니다</h3>
<p class="font-body-md text-body-sm text-secondary mb-space-lg leading-relaxed">
        저희 두 사람의 새로운 시작을<br/>함께 축복해 주시면 감사하겠습니다.
      </p>
<div class="w-full flex flex-col space-y-space-sm">
<button class="w-full py-3 rounded-lg bg-primary-container text-on-primary font-body-md text-body-md font-medium transition-colors hover:bg-primary" id="confirm-enter-btn" type="button">
          예식 안내 확인하기
        </button>
<button class="w-full py-2.5 rounded-lg bg-surface-container-low text-secondary font-body-md text-body-sm" id="close-modal-btn" type="button">
          닫기
        </button>
</div>
</div>
</div>
</div>
<script>
  (function () {
    // 1. Typing effect logic
    const fullText = "지훈 ♥ 서연 님의 결혼식에 초대합니다.";
    const typedTextEl = document.getElementById("typed-text");
    const cursorEl = document.getElementById("typing-cursor");
    let charIndex = 0;
    let isDeleting = false;

    function typeEffect() {
      if (!isDeleting && charIndex <= fullText.length) {
        typedTextEl.textContent = fullText.slice(0, charIndex);
        charIndex++;
        if (charIndex > fullText.length) {
          setTimeout(() => {
            isDeleting = false;
          }, 3500);
        } else {
          setTimeout(typeEffect, 95 + Math.random() * 40);
        }
      }
    }

    // Cursor Blink
    setInterval(() => {
      if (cursorEl) {
        cursorEl.style.opacity = cursorEl.style.opacity === "0" ? "1" : "0";
      }
    }, 530);

    setTimeout(typeEffect, 400);

    // 2. Interactive Modal Opening
    const openBtn = document.getElementById("open-invitation-btn");
    const modal = document.getElementById("envelope-modal");
    const card = document.getElementById("envelope-card");
    const closeBtn = document.getElementById("close-modal-btn");
    const confirmBtn = document.getElementById("confirm-enter-btn");

    function showModal() {
      modal.classList.remove("pointer-events-none", "opacity-0");
      modal.classList.add("opacity-100");
      card.classList.remove("scale-95");
      card.classList.add("scale-100");
    }

    function hideModal() {
      modal.classList.remove("opacity-100");
      modal.classList.add("opacity-0", "pointer-events-none");
      card.classList.remove("scale-100");
      card.classList.add("scale-95");
    }

    if (openBtn) openBtn.addEventListener("click", showModal);
    if (closeBtn) closeBtn.addEventListener("click", hideModal);
    if (confirmBtn) {
      confirmBtn.addEventListener("click", () => {
        hideModal();
        window.scrollTo({ top: window.innerHeight * 0.85, behavior: "smooth" });
      });
    }

    // 3. Ambient Canvas Petals Drift
    const canvas = document.getElementById("ambient-canvas");
    if (canvas) {
      const ctx = canvas.getContext("2d");
      let width = (canvas.width = canvas.offsetWidth);
      let height = (canvas.height = canvas.offsetHeight);

      window.addEventListener("resize", () => {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
      });

      const petals = Array.from({ length: 14 }).map(() => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: 2 + Math.random() * 2.5,
        speedX: -0.2 + Math.random() * 0.4,
        speedY: 0.3 + Math.random() * 0.5,
        angle: Math.random() * Math.PI * 2,
        angularSpeed: 0.01 + Math.random() * 0.02,
        alpha: 0.15 + Math.random() * 0.35,
      }));

      function render() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#C98B7B";

        petals.forEach((p) => {
          p.x += p.speedX;
          p.y += p.speedY;
          p.angle += p.angularSpeed;

          if (p.y > height + 10) p.y = -10;
          if (p.x > width + 10) p.x = -10;
          if (p.x < -10) p.x = width + 10;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.radius * 1.6, p.radius, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        requestAnimationFrame(render);
      }
      render();
    }
  })();
</script></main></body></html>
