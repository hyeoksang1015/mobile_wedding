<script>
  // Micro-interaction for Context Menu toggle
  const menuBtn = document.getElementById('menu-btn');
  const moreMenu = document.getElementById('more-menu');
  if (menuBtn && moreMenu) {
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      moreMenu.classList.toggle('hidden');
    });
    document.addEventListener('click', () => {
      if (!moreMenu.classList.contains('hidden')) {
        moreMenu.classList.add('hidden');
      }
    });
  }

  // Micro-interaction for Like Button
  const likeBtn = document.getElementById('like-btn');
  const likeCount = document.getElementById('like-count');
  let isLiked = true;
  if (likeBtn && likeCount) {
    likeBtn.addEventListener('click', () => {
      isLiked = !isLiked;
      const count = parseInt(likeCount.innerText, 10);
      likeCount.innerText = isLiked ? count + 1 : count - 1;
      const icon = likeBtn.querySelector('.material-symbols-outlined');
      if (isLiked) {
        icon.style.fontVariationSettings = "'FILL' 1";
        icon.classList.add('text-primary-container');
        icon.classList.remove('text-inverse-on-surface');
      } else {
        icon.style.fontVariationSettings = "'FILL' 0";
        icon.classList.remove('text-primary-container');
        icon.classList.add('text-inverse-on-surface');
      }
    });
  }

  // Micro-interaction for Smooth Scroll to Comment Input
  const commentBubbleBtn = document.getElementById('comment-bubble-btn');
  const commentInput = document.getElementById('comment-input');
  if (commentBubbleBtn && commentInput) {
    commentBubbleBtn.addEventListener('click', () => {
      commentInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
      commentInput.focus();
    });
  }
